name: Check asset IDs

# Checks all image IDs from src/shared/UI/Assets.luau against public Roblox endpoints
# (Image or Decal, moderation status) and looks up the Image ID for Decal IDs.
# With "fix", found Image IDs are filled in and pushed to the branch assets/fix-ids.

on:
  workflow_dispatch:
    inputs:
      fix:
        description: "Replace Decal IDs with Image IDs and push the branch assets/fix-ids"
        type: boolean
        default: false
  push:
    paths:
      - src/shared/UI/Assets.luau
      - tools/check-assets.py
      - .github/workflows/check-assets.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Manual runs use the key from the "Roblox" environment (Decal → Image ID via Open Cloud, needs asset read permission)
    environment: ${{ github.event_name == 'workflow_dispatch' && 'Roblox' || '' }}
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check IDs
        run: |
          python3 tools/check-assets.py ${{ inputs.fix && '--fix' || '' }} --report asset-report.md
          cat asset-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-report
          path: |
            asset-report.md
            asset-mapping.json

      - name: Push fix
        if: inputs.fix
        run: |
          if git diff --quiet; then
            echo "No Decal IDs to replace."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git checkout -B assets/fix-ids
          git commit -am "Assets: replace Decal IDs with Image IDs"
          git push -f origin assets/fix-ids
