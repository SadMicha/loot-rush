name: Upload UI assets

# Uploads the images listed in tools/upload-manifest.json through the Open Cloud Assets API
# and commits the resulting key -> asset ID list to assets/ui-asset-ids.csv.
# Secrets in the environment "Roblox": ROBLOX_API_KEY (Assets read + write), ROBLOX_CREATOR_USER_ID.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only upload these manifest keys (comma separated); empty = all missing"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: Roblox
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_CREATOR_USER_ID: ${{ secrets.ROBLOX_CREATOR_USER_ID || vars.ROBLOX_CREATOR_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload
        run: python3 tools/upload-assets.py --only "${{ inputs.only }}" | tee upload.log

      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat upload.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit IDs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/ui-asset-ids.csv || true
          git diff --cached --quiet || (git commit -m "Assets: UI asset IDs from Open Cloud upload" && git push)
